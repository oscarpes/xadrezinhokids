<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Xadrezinho Métricas — autorização</title>
<style>
  :root { --tinta:#1f2937; --fundo:#fffdf7; --ok:#15803d; --erro:#b91c1c; }
  body { margin:0; background:var(--fundo); color:var(--tinta); font:16px/1.6 system-ui, -apple-system, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; text-align:center; }
  .ok { color:var(--ok); } .erro { color:var(--erro); }
  code { display:block; word-break:break-all; background:#f3f4f6; padding:8px; border-radius:6px; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Autorização recebida</h1>
  <p id="texto">Pode fechar esta aba. O Xadrezinho Métricas já vai ler os números.</p>
  <code id="codigo"></code>
</main>
<script>
  // Página de retorno do login oficial (TikTok/Instagram) da ferramenta interna de métricas.
  // Não guarda nada: só mostra o código de uso único para a ferramenta trocar pelo acesso de leitura.
  const p = new URLSearchParams(location.search);
  const codigo = p.get('code');
  const erro = p.get('error') || p.get('error_description');
  if (erro || !codigo) {
    document.getElementById('titulo').textContent = 'Autorização não concluída';
    document.getElementById('titulo').className = 'erro';
    document.getElementById('texto').textContent = erro ? ('Motivo: ' + erro) : 'Nenhum código recebido.';
  } else {
    document.getElementById('titulo').className = 'ok';
    document.getElementById('codigo').textContent = codigo;
  }
</script>
</body>
</html>
